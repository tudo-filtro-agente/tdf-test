<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="mc_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="mc_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="mc_border2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="mc_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mc_icon" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="mc_chart" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
    <linearGradient id="mc_shine" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="mc_shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#mc_glow)"/>
  <circle cx="60" cy="60" r="54" fill="url(#mc_border)" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#mc_border2)" opacity="0.3"/>
  <circle cx="60" cy="60" r="50" fill="url(#mc_bg)"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#3b0764" stroke-width="1" opacity="0.6"/>
  <g filter="url(#mc_shadow)">
    <!-- Brain outline -->
    <g fill="none" stroke="url(#mc_icon)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left hemisphere -->
      <path d="M 56 38 C 46 38, 38 44, 38 52 C 38 56, 40 59, 42 61 C 40 63, 39 66, 40 69 C 41 73, 45 75, 49 75 C 50 78, 53 80, 56 80"/>
      <!-- Right hemisphere -->
      <path d="M 56 38 C 66 38, 74 44, 74 52 C 74 56, 72 59, 70 61 C 72 63, 73 66, 72 69 C 71 73, 67 75, 63 75 C 62 78, 59 80, 56 80"/>
      <!-- Center line -->
      <path d="M 56 42 L 56 76"/>
      <!-- Brain folds left -->
      <path d="M 56 50 C 50 50, 44 52, 42 56"/>
      <path d="M 56 62 C 50 62, 46 64, 44 67"/>
      <!-- Brain folds right -->
      <path d="M 56 50 C 62 50, 68 52, 70 56"/>
      <path d="M 56 62 C 62 62, 66 64, 68 67"/>
    </g>
    <!-- Rising chart (bottom right) -->
    <g stroke="url(#mc_chart)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="66,86 72,80 78,82 84,72 90,66"/>
      <!-- Arrow tip -->
      <polyline points="86,66 90,66 90,70"/>
    </g>
    <!-- Chart glow dots -->
    <circle cx="84" cy="72" r="1.5" fill="#d8b4fe" opacity="0.8"/>
    <circle cx="90" cy="66" r="2" fill="#d8b4fe" opacity="0.9"/>
  </g>
  <ellipse cx="60" cy="38" rx="30" ry="22" fill="url(#mc_shine)"/>
</svg>