<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="ac_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="ac_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="ac_border2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="ac_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ac_icon" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="ac_exhaust" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ac_shine" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="ac_shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#ac_glow)"/>
  <circle cx="60" cy="60" r="54" fill="url(#ac_border)" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#ac_border2)" opacity="0.3"/>
  <circle cx="60" cy="60" r="50" fill="url(#ac_bg)"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#164e63" stroke-width="1" opacity="0.6"/>
  <g filter="url(#ac_shadow)">
    <!-- Rocket body -->
    <path d="M 62 30 C 62 30, 72 40, 72 54 L 72 64 L 62 72 L 52 72 L 42 64 L 42 54 C 42 40, 52 30, 52 30 C 54 28, 60 28, 62 30 Z" fill="url(#ac_icon)" stroke="#67e8f9" stroke-width="0.5" opacity="0.9"/>
    <!-- Rocket window -->
    <circle cx="57" cy="46" r="6" fill="#083344" stroke="#67e8f9" stroke-width="1"/>
    <circle cx="57" cy="44" r="3" fill="#06b6d4" opacity="0.3"/>
    <!-- Rocket fins -->
    <path d="M 42 58 L 34 68 L 42 66 Z" fill="url(#ac_icon)" opacity="0.8"/>
    <path d="M 72 58 L 80 68 L 72 66 Z" fill="url(#ac_icon)" opacity="0.8"/>
    <!-- Exhaust flames -->
    <path d="M 52 72 L 54 84 L 57 78 L 60 86 L 63 78 L 62 72" fill="url(#ac_exhaust)" opacity="0.8"/>
    <!-- Document (small, bottom-right) -->
    <g transform="translate(74, 70)">
      <rect x="0" y="0" width="14" height="18" rx="2" fill="#0e7490" stroke="#67e8f9" stroke-width="1" opacity="0.8"/>
      <line x1="3" y1="5" x2="11" y2="5" stroke="#67e8f9" stroke-width="1" opacity="0.5"/>
      <line x1="3" y1="9" x2="11" y2="9" stroke="#67e8f9" stroke-width="1" opacity="0.5"/>
      <line x1="3" y1="13" x2="8" y2="13" stroke="#67e8f9" stroke-width="1" opacity="0.5"/>
    </g>
  </g>
  <ellipse cx="60" cy="38" rx="30" ry="22" fill="url(#ac_shine)"/>
</svg>