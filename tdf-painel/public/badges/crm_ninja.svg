<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="cn_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="cn_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="cn_border2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="cn_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cn_icon" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="cn_mask" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cn_shine" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="cn_shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#22c55e" flood-opacity="0.6"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#cn_glow)"/>
  <circle cx="60" cy="60" r="54" fill="url(#cn_border)" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#cn_border2)" opacity="0.3"/>
  <circle cx="60" cy="60" r="50" fill="url(#cn_bg)"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#166534" stroke-width="1" opacity="0.6"/>
  <g filter="url(#cn_shadow)">
    <!-- Clipboard/checklist -->
    <rect x="38" y="34" width="30" height="42" rx="3" fill="none" stroke="url(#cn_icon)" stroke-width="2"/>
    <rect x="48" y="30" width="10" height="6" rx="2" fill="url(#cn_icon)"/>
    <!-- Checklist items -->
    <g stroke="url(#cn_icon)" stroke-width="1.5" fill="none" stroke-linecap="round">
      <!-- Check 1 -->
      <polyline points="42,46 44,48 48,43" stroke-width="2"/>
      <line x1="52" y1="46" x2="64" y2="46"/>
      <!-- Check 2 -->
      <polyline points="42,56 44,58 48,53" stroke-width="2"/>
      <line x1="52" y1="56" x2="64" y2="56"/>
      <!-- Check 3 -->
      <polyline points="42,66 44,68 48,63" stroke-width="2"/>
      <line x1="52" y1="66" x2="64" y2="66"/>
    </g>
    <!-- Ninja mask (overlapping top-right) -->
    <g transform="translate(72, 42)">
      <!-- Mask band -->
      <ellipse cx="0" cy="0" rx="16" ry="8" fill="url(#cn_mask)" stroke="#475569" stroke-width="1"/>
      <!-- Eyes -->
      <ellipse cx="-6" cy="0" rx="4" ry="2.5" fill="#22c55e" opacity="0.9"/>
      <ellipse cx="6" cy="0" rx="4" ry="2.5" fill="#22c55e" opacity="0.9"/>
      <!-- Eye glints -->
      <circle cx="-5" cy="-1" r="1" fill="#86efac" opacity="0.7"/>
      <circle cx="7" cy="-1" r="1" fill="#86efac" opacity="0.7"/>
      <!-- Mask tails -->
      <path d="M 14 -2 L 22 -6 L 20 -2" fill="url(#cn_mask)" stroke="#475569" stroke-width="0.5"/>
      <path d="M 14 2 L 24 2 L 22 5" fill="url(#cn_mask)" stroke="#475569" stroke-width="0.5"/>
    </g>
  </g>
  <ellipse cx="60" cy="38" rx="30" ry="22" fill="url(#cn_shine)"/>
</svg>