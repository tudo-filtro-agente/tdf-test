<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="ex_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="ex_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="ex_border2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="ex_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78716c" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#78716c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#78716c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ex_icon" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#d6d3d1"/>
      <stop offset="50%" stop-color="#78716c"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <linearGradient id="ex_fist" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#d6d3d1"/>
      <stop offset="50%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#78716c"/>
    </linearGradient>
    <linearGradient id="ex_shine" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="ex_shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a8a29e" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#ex_glow)"/>
  <circle cx="60" cy="60" r="54" fill="url(#ex_border)" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#ex_border2)" opacity="0.3"/>
  <circle cx="60" cy="60" r="50" fill="url(#ex_bg)"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#44403c" stroke-width="1" opacity="0.6"/>
  <g filter="url(#ex_shadow)">
    <!-- Raised fist -->
    <g fill="url(#ex_fist)" stroke="url(#ex_icon)" stroke-width="1.5" stroke-linejoin="round">
      <!-- Forearm -->
      <path d="M 42 88 L 42 60 C 42 56, 44 54, 48 54 L 56 54 C 58 54, 60 56, 60 58 L 60 88"/>
      <!-- Fingers (curled fist) -->
      <path d="M 44 54 L 44 46 C 44 42, 46 40, 48 40 C 50 40, 52 42, 52 44 L 52 54"/>
      <path d="M 48 54 L 48 42 C 48 38, 50 36, 52 36 C 54 36, 56 38, 56 40 L 56 54"/>
      <path d="M 52 54 L 52 44 C 52 40, 54 38, 56 38 C 58 38, 60 40, 60 42 L 60 54"/>
      <!-- Thumb -->
      <path d="M 42 58 C 38 56, 38 52, 40 50 C 42 48, 44 50, 44 52"/>
    </g>
    <!-- Finger line details -->
    <g stroke="#57534e" stroke-width="0.5" opacity="0.5">
      <line x1="44" y1="48" x2="52" y2="48"/>
      <line x1="48" y1="44" x2="60" y2="44"/>
    </g>
    <!-- Checklist (right side) -->
    <g transform="translate(66, 38)">
      <rect x="0" y="0" width="22" height="32" rx="2" fill="none" stroke="url(#ex_icon)" stroke-width="1.5"/>
      <!-- Check items -->
      <polyline points="4,8 6,10 10,6" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="13" y1="8" x2="19" y2="8" stroke="#78716c" stroke-width="1"/>
      <polyline points="4,16 6,18 10,14" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="13" y1="16" x2="19" y2="16" stroke="#78716c" stroke-width="1"/>
      <polyline points="4,24 6,26 10,22" fill="none" stroke="#a8a29e" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="13" y1="24" x2="19" y2="24" stroke="#78716c" stroke-width="1"/>
    </g>
  </g>
  <!-- Impact lines -->
  <g stroke="#a8a29e" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <line x1="34" y1="34" x2="30" y2="30"/>
    <line x1="30" y1="42" x2="24" y2="40"/>
    <line x1="36" y1="48" x2="30" y2="50"/>
  </g>
  <ellipse cx="60" cy="38" rx="30" ry="22" fill="url(#ex_shine)"/>
</svg>