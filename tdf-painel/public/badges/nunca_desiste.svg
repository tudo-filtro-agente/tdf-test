<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="nd_bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="nd_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="nd_border2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="nd_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nd_icon" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="nd_shine" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="nd_shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.6"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#nd_glow)"/>
  <circle cx="60" cy="60" r="54" fill="url(#nd_border)" opacity="0.8"/>
  <circle cx="60" cy="60" r="53" fill="url(#nd_border2)" opacity="0.3"/>
  <circle cx="60" cy="60" r="50" fill="url(#nd_bg)"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#3b0764" stroke-width="1" opacity="0.6"/>
  <!-- Phone -->
  <g filter="url(#nd_shadow)">
    <rect x="46" y="38" width="22" height="38" rx="4" fill="none" stroke="url(#nd_icon)" stroke-width="2.5"/>
    <rect x="49" y="44" width="16" height="22" rx="1" fill="url(#nd_icon)" opacity="0.2"/>
    <circle cx="57" cy="71" r="2" fill="#c4b5fd" opacity="0.6"/>
    <!-- Retry arrows (circular) -->
    <g stroke="url(#nd_icon)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <!-- Top arrow arc -->
      <path d="M 76 48 A 14 14 0 0 1 82 62"/>
      <!-- Arrow head top -->
      <path d="M 79 60 L 82 62 L 85 59" stroke-width="2"/>
      <!-- Bottom arrow arc -->
      <path d="M 82 62 A 14 14 0 0 1 76 76"/>
      <!-- Arrow head bottom -->
      <path d="M 78 74 L 76 76 L 79 78" stroke-width="2"/>
      <!-- Back up arc -->
      <path d="M 76 76 A 14 14 0 0 1 76 48"/>
      <!-- Arrow head back -->
      <path d="M 74 50 L 76 48 L 78 50" stroke-width="2"/>
    </g>
  </g>
  <ellipse cx="60" cy="38" rx="30" ry="22" fill="url(#nd_shine)"/>
</svg>